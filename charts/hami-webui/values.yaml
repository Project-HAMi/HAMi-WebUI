# Default values for hami-webui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

vendorNodeSelectors:
  NVIDIA: gpu=on
  Ascend: ascend=on
  DCU: dcu=on
  MLU: mlu=on
  Metax: metax-tech.com/gpu.installed=true

image:
  repository: projecthami/hami-webui
  pullPolicy: IfNotPresent
  # Overrides the image tag. When empty, a semantic chart appVersion uses its
  # matching v-prefixed release tag (with '+' mapped to '_', as OCI tags do not
  # allow '+'); other appVersions are used unchanged.
  tag: "v2.0.0"
  # When set, digest takes precedence over tag and renders repository@digest.
  digest: "sha256:80a8f63dab912d714dc1c12b90ee46b3557352c9cb11070968d25eba9644ca83"

# Image pull secrets used by the WebUI Pod.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          # Prefix is required so SPA deep links, assets, and API routes share
          # the same portable, non-stripped path contract.
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 250m
    memory: 750Mi
  requests:
    cpu: 250m
    memory: 750Mi

# Additional environment variables for the application container. Configure
# the public path and iframe policy through frontend.*; the Chart reserves the
# corresponding HAMI_WEBUI_* variables so rendered access instructions cannot
# drift from the running application.
env:
  - name: TZ
    value: "Asia/Shanghai"

# ServiceMonitor resources require Prometheus Operator CRDs. In raw/manual
# scrape mode, disable this block, hamiServiceMonitor, and the dcgm-exporter
# ServiceMonitor together, then configure equivalent scrape jobs yourself.
serviceMonitor:
  enabled: true
  interval: 15s
  honorLabels: false
  additionalLabels:
    jobRelease: hami-webui-prometheus
  relabelings: []

hamiServiceMonitor:
  # Keep this monitor by default and leave HAMi's prometheus.enabled=false. It
  # preserves workload labels; disable it only when another selected monitor
  # owns the same endpoint and is confirmed to set honorLabels: true, or when
  # using raw/manual scrape configuration.
  enabled: true
  interval: 15s
  # Preserve HAMi's namespace/pod/container workload labels when they collide
  # with Prometheus scrape-target labels; required by the WebUI queries.
  honorLabels: true
  additionalLabels:
    jobRelease: hami-webui-prometheus
  svcNamespace: kube-system
  relabelings: []

nodeSelector: {}

tolerations: []

affinity: {}

dcgm-exporter:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    honorLabels: false
    additionalLabels:
      jobRelease: hami-webui-prometheus
  nodeSelector:
    gpu: "on"

# Prometheus ownership is explicit: enable exactly one of this dependency and
# externalPrometheus. The defaults intentionally enable neither so Helm fails
# with an actionable message until the installer chooses a real backend.
kube-prometheus-stack:
  enabled: false
  crds:
    enabled: false
  defaultRules:
    create: false
  alertmanager:
    enabled: false
  grafana:
    enabled: false
  kubernetesServiceMonitors:
    enabled: false
  nodeExporter:
    enabled: false
  kube-state-metrics:
    prometheus:
      monitor:
        additionalLabels:
          jobRelease: hami-webui-prometheus
  prometheusOperator:
    enabled: false
  prometheus:
    prometheusSpec:
      serviceMonitorSelector:
        matchLabels:
          jobRelease: hami-webui-prometheus

externalPrometheus:
  enabled: false
  # Required when enabled. Use the real in-cluster HTTP API address of an
  # existing Prometheus or VictoriaMetrics instance; the Chart does not guess
  # release names or namespaces.
  address: ""
  # Single PromQL upstream timeout (sent to Prometheus / VictoriaMetrics as the &timeout= parameter).
  timeout: "1m"
  # Optional HTTP Authorization credentials. Set existingSecret and
  # credentialsKey together to enable this mode. The Secret value is mounted as
  # a file and is never copied into the ConfigMap or Pod environment.
  authorization:
    type: "Bearer"
    existingSecret: ""
    credentialsKey: ""
  # Optional HTTP Basic Authentication credentials. This mode is mutually
  # exclusive with authorization. Use HTTPS unless transport security is
  # provided outside the application.
  basicAuth:
    existingSecret: ""
    usernameKey: ""
    passwordKey: ""
  tls:
    # HTTPS certificates are verified by default. Use this only as a temporary
    # escape hatch when a CA cannot yet be supplied.
    insecureSkipVerify: false
    # Optional certificate name override for HTTPS endpoints.
    serverName: ""
    # Mount trust material from an existing Secret. Set caKey for a private CA;
    # set certKey and keyKey together when the endpoint requires mTLS.
    existingSecret: ""
    caKey: ""
    certKey: ""
    keyKey: ""

# Public Web-entry runtime settings.
frontend:
  # Public URL prefix served by the official Go Web entry. A configured
  # Ingress Prefix must cover this path and must not strip or rewrite it.
  basePath: "/"
  # Framing policy for whole-SPA embedding. null preserves the Chart 1.x
  # behavior (no application framing header), [] blocks every parent, and a
  # non-empty list allows only the listed origins. The first release accepts
  # only "'self'" and exact http(s) origins.
  frameAncestors: null

# Kratos API timeout. This bounds each incoming API request context without
# affecting background metric collection.
backend:
  http:
    timeout: "60s"

# The unified process starts both listeners only after Kubernetes informer
# caches have synced. The startup budget allows five minutes for that initial
# sync; subsequent probes verify the public Web entry.
probes:
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

# Background /metrics collector. The collector runs independently of Prometheus scrape;
# scrapes only serialize the in-memory registry, so they are O(1) and immune to scrape
# timeouts. Tune interval if you need fresher data or want to reduce upstream load further.
metricsExporter:
  # How often the collector refreshes hami_* metrics from the upstream Prometheus / VictoriaMetrics.
  interval: "30s"
  # Hard cap on a single refresh cycle. Should be >= externalPrometheus.timeout and < interval * 2.
  timeout: "60s"

# The browser API timeout (default 60000ms) is compiled into the JavaScript
# bundle from VITE_APP_REQUEST_TIMEOUT. Changing it requires rebuilding the
# unified image; it cannot be tuned through this values file.
