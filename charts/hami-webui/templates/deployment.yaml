{{- $podAnnotations := mergeOverwrite (dict) (default (dict) .Values.podAnnotations) (dict "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum)) -}}
{{- $frontendEnv := default (list) .Values.env.frontend -}}
{{- $frontendProxyTimeoutOverridden := false -}}
{{- range $frontendEnv -}}
{{- if eq (get . "name") "HAMI_WEBUI_PROXY_TIMEOUT" -}}
{{- $frontendProxyTimeoutOverridden = true -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hami-webui.fullname" . }}
  namespace: {{ include "hami-webui.namespace" . }}
  labels:
    {{- include "hami-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: "hami-webui"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hami-webui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: "hami-webui"
  template:
    metadata:
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
      labels:
        {{- include "hami-webui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: "hami-webui"
    spec:
      serviceAccountName: {{ include "hami-webui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-fe-oss
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "hami-webui.image" (dict "name" "frontend" "image" .Values.image.frontend "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          env:
            {{- if not $frontendProxyTimeoutOverridden }}
            - name: HAMI_WEBUI_PROXY_TIMEOUT
              value: {{ default "65s" (get (default (dict) .Values.frontend) "proxyTimeout") | quote }}
            {{- end }}
            {{- with $frontendEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.frontend }}
          {{- with .livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .readinessProbe }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
        - name: {{ .Chart.Name }}-be-oss
          securityContext:
                  {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "hami-webui.image" (dict "name" "backend" "image" .Values.image.backend "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          env:
            {{- toYaml .Values.env.backend | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          command:
            - "/apps/server"
          args:
            - "--conf"
            - "/apps/config/config.yaml"
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /apps/config/
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hami-webui.fullname" . }}-config
