syntax = "proto3";

package api.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "vgpu/api/v1;v1";

service Card {
  rpc GetAllGPUs (GetAllGpusReq) returns (GPUsReply) {
    option (google.api.http) = {
      post: "/v1/gpus"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List accelerators";
    };
  }

  rpc GetAllGPUTypes (GetAllGpusReq) returns (GPUsReply) {
    option (google.api.http) = {
      post: "/v1/gpu-types"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List accelerator types";
    };
  }

  rpc GetGPU (GetGpuReq) returns (GPUReply) {
    option (google.api.http) = {
      get: "/v1/gpu"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get accelerator details";
    };
  }
}

message GetGpuReq {
  string uid = 1;
}

message GetAllGpusReq {
  message Filters {
    string uid = 1;
    string type = 2;
    string node_name = 3;
    string provider = 4;
  }
  Filters filters = 1;
}

message GPUReply {
  string uuid = 1;
  string node_name = 2;
  string type = 3;
  int32 vgpu_used = 4;
  int32 vgpu_total = 5;
  int32 core_used = 6;
  int32 core_total = 7;
  int32 memory_used = 8;
  int32 memory_total = 9;
  string node_uid = 10;
  bool health = 11;
  // How the plugin divides the device: hami-core, mig or template. Empty for
  // vendors whose plugins do not register one.
  string mode = 12;
  optional bool core_used_known = 13;
  // Registered but absent from HAMi's device configuration.
  bool unconfigured = 14;
  // Provider, such as NVIDIA or Ascend.
  string vendor = 15;
  // MIG profiles the device plugin registered for this GPU.
  repeated MigProfile mig_profiles = 16;
}

// One MIG device type and where NVML allows it on the GPU.
message MigProfile {
  reserved 4;
  reserved "instance_count";
  string name = 1;
  int32 memory_mb = 2;
  int32 slice_count = 3;
  // Compute share of the whole GPU, in percent.
  int32 core = 5;
  repeated MigPlacement placements = 6;
}

message MigPlacement {
  int32 start = 1;
  int32 size = 2;
}

message GPUsReply {
  repeated GPUReply list = 1;
}
