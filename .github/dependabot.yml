version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - kind/cleanup
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - kind/cleanup
    # Dockerfile toolchain versions must stay aligned with .node-version and
    # package.json, so image updates need a coordinated maintainer PR.
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - kind/cleanup
    # Dockerfile toolchain versions must stay aligned with server/.go-version,
    # so image updates need a coordinated maintainer PR.
    open-pull-requests-limit: 0
