version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - kind/cleanup
    groups:
      github-actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - kind/cleanup
    groups:
      npm-security-production:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"
      npm-security-development:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
      npm-routine-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-routine-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Coordinate major migrations explicitly; this does not suppress security updates.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - kind/cleanup
    # Dockerfile toolchain versions must stay aligned with .node-version and
    # package.json, so image updates need a coordinated maintainer PR.
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - kind/cleanup
    # Dockerfile toolchain versions must stay aligned with server/.go-version,
    # so image updates need a coordinated maintainer PR.
    open-pull-requests-limit: 0
