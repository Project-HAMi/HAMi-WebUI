version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - kind/cleanup
    groups:
      github-actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - kind/cleanup
    # Dockerfile toolchain versions must stay aligned with .node-version and
    # package.json, so image updates need a coordinated maintainer PR.
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - kind/cleanup
    # Dockerfile toolchain versions must stay aligned with server/.go-version,
    # so image updates need a coordinated maintainer PR.
    open-pull-requests-limit: 0
