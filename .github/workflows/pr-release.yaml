name: PR Release Controller Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            release:
              - '.github/workflows/release.yaml'
              - '.github/workflows/pr-release.yaml'
              - 'charts/hami-webui/Chart.yaml'
              - 'charts/hami-webui/README.md'
              - 'docs/installation/helm/index.md'
              - 'scripts/verify-install-docs.sh'
              - 'scripts/release/**'
              - 'docs/releasing.md'

  validate:
    name: Validate release controller
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned validation tools
        run: |
          tool_dir="${RUNNER_TEMP}/release-validation/bin"
          bash scripts/release/install-validation-tools.sh "${tool_dir}"
          yq_path="$(bash scripts/release/install-yq.sh "${tool_dir}/yq")"
          [[ "${yq_path}" == "${tool_dir}/yq" ]]
          echo "${tool_dir}" >>"${GITHUB_PATH}"

      - name: Validate workflow syntax and expressions
        run: actionlint .github/workflows/release.yaml .github/workflows/pr-release.yaml

      - name: Check release shell scripts
        run: shellcheck scripts/verify-install-docs.sh scripts/release/*.sh scripts/release/tests/*.sh

      - name: Verify version-matched installation documentation
        run: bash scripts/verify-install-docs.sh

      - name: Run deterministic release contract tests
        run: bash scripts/release/tests/release-controller.sh

  artifact-producer:
    name: Upload release handoff fixtures
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create distinct handoff fixtures
        run: |
          mkdir -p "${RUNNER_TEMP}/artifact-contract/part-a"
          mkdir -p "${RUNNER_TEMP}/artifact-contract/part-b"
          mkdir -p "${RUNNER_TEMP}/artifact-contract/pages"
          printf 'artifact-part-a\n' >"${RUNNER_TEMP}/artifact-contract/part-a/part-a.txt"
          printf 'artifact-part-b\n' >"${RUNNER_TEMP}/artifact-contract/part-b/part-b.txt"
          printf 'pages-artifact-v5\n' >"${RUNNER_TEMP}/artifact-contract/pages/index.html"

      - name: Upload part A
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}-part-a
          path: ${{ runner.temp }}/artifact-contract/part-a/
          if-no-files-found: error
          retention-days: 1

      - name: Upload part B
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}-part-b
          path: ${{ runner.temp }}/artifact-contract/part-b/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages fixture
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pr-release-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-contract/pages/
          retention-days: 1

  artifact-consumer:
    name: Verify release handoff downloads
    needs:
      - changes
      - artifact-producer
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download one part by name
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}-part-a
          path: ${{ runner.temp }}/artifact-contract/by-name

      - name: Download and merge all parts by pattern
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}-part-*
          path: ${{ runner.temp }}/artifact-contract/merged
          merge-multiple: true

      - name: Download through the authenticated handoff path
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}-part-b
          path: ${{ runner.temp }}/artifact-contract/authenticated
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download the Pages fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-release-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-contract/pages-download

      - name: Verify every downloaded byte and layout
        run: |
          set -euo pipefail
          [[ "$(cat "${RUNNER_TEMP}/artifact-contract/by-name/part-a.txt")" == 'artifact-part-a' ]]
          [[ "$(cat "${RUNNER_TEMP}/artifact-contract/merged/part-a.txt")" == 'artifact-part-a' ]]
          [[ "$(cat "${RUNNER_TEMP}/artifact-contract/merged/part-b.txt")" == 'artifact-part-b' ]]
          [[ "$(cat "${RUNNER_TEMP}/artifact-contract/authenticated/part-b.txt")" == 'artifact-part-b' ]]
          [[ "$(find "${RUNNER_TEMP}/artifact-contract/merged" -type f | wc -l | tr -d ' ')" == '2' ]]
          pages_archive="${RUNNER_TEMP}/artifact-contract/pages-download/artifact.tar"
          mapfile -t pages_entries < <(tar -tf "${pages_archive}")
          [[ "${#pages_entries[@]}" == '2' ]]
          [[ "${pages_entries[0]}" == './' ]]
          [[ "${pages_entries[1]}" == './index.html' ]]
          mkdir -p "${RUNNER_TEMP}/artifact-contract/pages-unpacked"
          tar -xf "${pages_archive}" \
            -C "${RUNNER_TEMP}/artifact-contract/pages-unpacked"
          pages_index="${RUNNER_TEMP}/artifact-contract/pages-unpacked/index.html"
          [[ -f "${pages_index}" && ! -L "${pages_index}" ]]
          printf 'pages-artifact-v5\n' >"${RUNNER_TEMP}/artifact-contract/pages-expected"
          cmp --silent "${RUNNER_TEMP}/artifact-contract/pages-expected" "${pages_index}"

  pr-release-required:
    name: pr-release-required
    needs:
      - changes
      - validate
      - artifact-producer
      - artifact-consumer
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate release controller results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Release change detection did not complete successfully: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.release }}" != "true" ]]; then
            echo "No release-controller changes; skipping."
            exit 0
          fi
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Release controller checks did not complete successfully: ${{ needs.validate.result }}"
            exit 1
          fi
          if [[ "${{ needs.artifact-producer.result }}" != "success" ]]; then
            echo "Release artifact upload did not complete successfully: ${{ needs.artifact-producer.result }}"
            exit 1
          fi
          if [[ "${{ needs.artifact-consumer.result }}" != "success" ]]; then
            echo "Release artifact download did not complete successfully: ${{ needs.artifact-consumer.result }}"
            exit 1
          fi
          echo "All release controller checks passed."
