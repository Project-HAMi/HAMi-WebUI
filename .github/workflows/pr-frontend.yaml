name: PR Frontend Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run when the Vue app, legacy Nest code, Go Web entry, or their build and
  # contract inputs change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'packages/**'
              - 'package.json'
              - '.browserslistrc'
              - '.dockerignore'
              - '.node-version'
              - 'Dockerfile'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'server/.go-version'
              - 'server/cmd/web-entry/**'
              - 'server/go.mod'
              - 'server/go.sum'
              - 'server/internal/webentry/**'
              - 'scripts/precompress-web-assets.mjs'
              - 'scripts/verify-toolchain-versions.sh'
              - 'scripts/verify-vite-env-boundary.mjs'
              - 'test/web-entry/**'
              - 'tsconfig*.json'
              - 'Makefile'
              - '.github/workflows/pr-frontend.yaml'

  build-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum
      - name: Verify toolchain versions
        run: bash scripts/verify-toolchain-versions.sh
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build BFF
        run: pnpm run build
      - name: Build web and verify environment boundary
        run: pnpm run verify:vite-env
      - name: Pre-compress Web assets
        run: pnpm run precompress:web-assets
      - name: Build Go Web entry
        working-directory: server
        run: mkdir -p build && GOTOOLCHAIN=local go build -mod=readonly -trimpath -o build/web-entry ./cmd/web-entry
      - name: Test Web-entry contract
        run: pnpm run test:web-entry-contract
      - name: Test web
        run: pnpm --filter hami-webui-web run test:metrics
      - name: Test BFF
        run: pnpm test

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The package `lint` script auto-fixes (`--fix`) and `--require`s a
      # structured-clone polyfill that is not committed to the repo; run ESLint
      # directly in check mode (the supported Node runtime has structuredClone).
      - name: Lint BFF
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" "test/web-entry/**/*.mjs" "scripts/precompress-web-assets.mjs"
      - name: Lint web
        run: pnpm --filter hami-webui-web run lint

  # Single required status check: green only if every frontend job passed (or
  # there were no frontend-relevant changes).
  pr-frontend-required:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-test
      - lint
    if: always()
    steps:
      - name: Aggregate frontend check results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Frontend change detection did not complete successfully: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.frontend }}" != "true" ]]; then
            echo "No frontend-relevant changes; skipping."
            exit 0
          fi
          for result in \
            "${{ needs.build-test.result }}" \
            "${{ needs.lint.result }}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Frontend checks did not complete successfully: ${result}"
              exit 1
            fi
          done
          echo "All frontend checks passed."
