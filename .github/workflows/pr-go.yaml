name: PR Go Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

env:
  GOLANGCI_VERSION: "v2.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only run the Go jobs when the backend (server/) or this workflow changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - 'server/**'
              - 'scripts/verify-toolchain-versions.sh'
              - '.github/workflows/pr-go.yaml'

  # `make generate` (proto + wire) is mandatory before build/vet/test because
  # the generated code is NOT committed (server/.gitignore ignores *.pb.go and
  # *_gen.go).
  build-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum
      - name: Verify toolchain versions
        run: bash ../scripts/verify-toolchain-versions.sh
      - name: Install checksum-verified protoc
        run: |
          bash hack/install-protoc.sh "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >>"${GITHUB_PATH}"
      - name: Install codegen tools (wire / kratos / protoc-gen-*)
        run: make install-deps
      - name: Generate, build, vet, and test
        run: make verify

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/.go-version
          cache-dependency-path: server/go.sum
      - name: Install checksum-verified protoc
        run: |
          bash hack/install-protoc.sh "${RUNNER_TEMP}/protoc"
          echo "${RUNNER_TEMP}/protoc/bin" >>"${GITHUB_PATH}"
      - name: Install codegen tools (wire / kratos / protoc-gen-*)
        run: make install-deps
      - name: Generate proto + wire
        run: make generate
      - name: Verify module metadata
        run: make verify-mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: server
          # Only flag issues introduced by the PR so the legacy codebase does
          # not block every PR. Generated files (DO NOT EDIT header) are skipped
          # by golangci-lint automatically.
          only-new-issues: true

  # Cross-platform image builds execute protoc on BUILDPLATFORM, so an x86
  # runner does not exercise the arm64 archive when it builds an arm64 binary.
  protoc-arm64:
    name: Verify arm64 protoc installer
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up arm64 execution
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Install and execute the arm64 archive
        run: bash server/hack/install-protoc.sh "${RUNNER_TEMP}/protoc-arm64" arm64

  # Single required status check: green only if every Go job passed (or there
  # were no Go-relevant changes).
  pr-go-required:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-test
      - lint
      - protoc-arm64
    if: always()
    steps:
      - name: Aggregate Go check results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Go change detection did not complete successfully: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.go }}" != "true" ]]; then
            echo "No Go-relevant changes; skipping."
            exit 0
          fi
          for result in \
            "${{ needs.build-test.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.protoc-arm64.result }}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Go checks did not complete successfully: ${result}"
              exit 1
            fi
          done
          echo "All Go checks passed."
