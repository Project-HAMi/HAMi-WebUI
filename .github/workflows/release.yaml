name: Verified Stable Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Bootstrap the public OCI package, build candidates, or publish a verified release
        required: true
        type: choice
        options:
          - bootstrap-oci
          - candidate
          - publish
      source_sha:
        description: Full current main SHA (candidate phase only)
        required: false
        type: string
      candidate_run_id:
        description: Successful candidate phase run ID (publish phase only)
        required: false
        type: string

permissions: {}

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  HELM_VERSION: v3.21.4
  PAGES_URL: https://project-hami.github.io/HAMi-WebUI

jobs:
  bootstrap-oci-prepare:
    name: Package non-stable OCI bootstrap chart
    if: inputs.phase == 'bootstrap-oci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      chart_file: ${{ steps.package.outputs.chart_file }}
    steps:
      - name: Require the trusted default branch
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "Project-HAMi/HAMi-WebUI" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]

      - name: Checkout main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure locked dependency repositories
        run: |
          helm repo add nvidia-dcgm https://nvidia.github.io/dcgm-exporter/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Package one auditable non-stable version
        id: package
        run: |
          set -euo pipefail
          version="0.0.0-bootstrap.${GITHUB_RUN_ID}"
          lock_before="$(sha256sum charts/hami-webui/Chart.lock | awk '{print $1}')"
          helm dependency build charts/hami-webui --skip-refresh
          [[ "$(sha256sum charts/hami-webui/Chart.lock | awk '{print $1}')" == "${lock_before}" ]]
          helm lint charts/hami-webui
          helm template oci-bootstrap charts/hami-webui >/dev/null
          mkdir bootstrap-bundle
          helm package charts/hami-webui \
            --version "${version}" \
            --app-version "${version}" \
            --destination bootstrap-bundle
          chart_file="hami-webui-${version}.tgz"
          [[ -f "bootstrap-bundle/${chart_file}" ]]
          (
            cd bootstrap-bundle
            sha256sum "${chart_file}" >SHA256SUMS
          )
          {
            echo "version=${version}"
            echo "chart_file=${chart_file}"
          } >>"${GITHUB_OUTPUT}"

      - name: Upload the fixed bootstrap package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-oci-bootstrap-${{ github.run_id }}
          path: bootstrap-bundle/
          if-no-files-found: error
          retention-days: 7

  bootstrap-oci-publish:
    name: Create and verify public OCI package
    if: inputs.phase == 'bootstrap-oci'
    needs: bootstrap-oci-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout scripts without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the same bootstrap package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-oci-bootstrap-${{ github.run_id }}
          path: bootstrap-bundle

      - name: Verify bootstrap artifact bytes
        run: |
          cd bootstrap-bundle
          sha256sum --check SHA256SUMS

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log Helm in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish and anonymously verify the bootstrap package
        run: |
          bash scripts/release/publish-oci.sh \
            "bootstrap-bundle/${{ needs.bootstrap-oci-prepare.outputs.chart_file }}" \
            "${{ needs.bootstrap-oci-prepare.outputs.version }}"

  candidate-preflight:
    name: Validate candidate source
    if: inputs.phase == 'candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      candidate_tag: ${{ steps.source.outputs.candidate_tag }}
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact current main commit
        id: source
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "Project-HAMi/HAMi-WebUI" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${SOURCE_SHA_INPUT}" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          source_sha="$(git rev-parse "${SOURCE_SHA_INPUT}^{commit}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "${source_sha}" == "${SOURCE_SHA_INPUT}" ]]
          [[ "${source_sha}" == "${main_sha}" ]]
          candidate_tag="candidate-${source_sha:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "source_sha=${source_sha}"
            echo "candidate_tag=${candidate_tag}"
          } >>"${GITHUB_OUTPUT}"

  candidate-images:
    name: Build ${{ matrix.component }} candidate once
    if: inputs.phase == 'candidate'
    needs: candidate-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: .
            dockerhub_repository: projecthami/hami-webui-fe-oss
            ghcr_repository: ghcr.io/project-hami/hami-webui-fe-oss
          - component: backend
            context: ./server
            dockerhub_repository: projecthami/hami-webui-be-oss
            ghcr_repository: ghcr.io/project-hami/hami-webui-be-oss
    steps:
      - name: Checkout candidate source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate-preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build once and push unique candidate references
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ matrix.dockerhub_repository }}:${{ needs.candidate-preflight.outputs.candidate_tag }}
            ${{ matrix.ghcr_repository }}:${{ needs.candidate-preflight.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.revision=${{ needs.candidate-preflight.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=stable-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=stable-${{ matrix.component }}

      - name: Record both registry digests
        run: |
          bash scripts/release/record-candidate-image.sh \
            "${{ matrix.component }}" \
            "${{ needs.candidate-preflight.outputs.source_sha }}" \
            "${{ needs.candidate-preflight.outputs.candidate_tag }}" \
            "${{ matrix.dockerhub_repository }}" \
            "${{ matrix.ghcr_repository }}" \
            "candidate-metadata/${{ matrix.component }}.json"

      - name: Upload image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-part-${{ github.run_id }}-${{ matrix.component }}
          path: candidate-metadata/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 2

  candidate-manifest:
    name: Seal candidate manifest
    if: inputs.phase == 'candidate'
    needs:
      - candidate-preflight
      - candidate-images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-candidate-part-${{ github.run_id }}-*
          path: candidate-parts
          merge-multiple: true

      - name: Create candidate manifest
        env:
          SOURCE_SHA: ${{ needs.candidate-preflight.outputs.source_sha }}
          CANDIDATE_TAG: ${{ needs.candidate-preflight.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          [[ -f candidate-parts/frontend.json ]]
          [[ -f candidate-parts/backend.json ]]
          jq -e -s \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg candidate_tag "${CANDIDATE_TAG}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" '
              if length != 2 or
                 any(.[]; .sourceSha != $source_sha or .candidateTag != $candidate_tag) or
                 ([.[].component] | sort != ["backend", "frontend"])
              then error("candidate image metadata is incomplete or inconsistent")
              else {
                schemaVersion: 1,
                repository: $repository,
                workflow: ".github/workflows/release.yaml",
                sourceSha: $source_sha,
                candidateTag: $candidate_tag,
                runId: $run_id,
                runAttempt: $run_attempt,
                images: reduce .[] as $image ({};
                  .[$image.component] = $image.registries)
              }
              end
            ' candidate-parts/*.json >candidate.json
          jq -e . candidate.json >/dev/null

      - name: Upload sealed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.run_id }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Record candidate handoff
        run: |
          {
            echo "### Candidate sealed"
            echo
            echo "Candidate run ID: \`${GITHUB_RUN_ID}\`"
            echo "Source: \`${{ needs.candidate-preflight.outputs.source_sha }}\`"
            echo "Use this run ID only after a release-metadata PR locks the four recorded digests."
          } >>"${GITHUB_STEP_SUMMARY}"

  prepare-release:
    name: Verify contract and package chart once
    if: inputs.phase == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      chart_file: ${{ steps.package.outputs.chart_file }}
      chart_sha256: ${{ steps.package.outputs.chart_sha256 }}
      release_sha: ${{ steps.contract.outputs.release_sha }}
    steps:
      - name: Validate publish input
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "Project-HAMi/HAMi-WebUI" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]]

      - name: Checkout current main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download sealed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify candidate workflow run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          workflow_id="$(jq -r '.workflow_id' <<<"${run_json}")"
          workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
          [[ "$(jq -r '.event' <<<"${run_json}")" == "workflow_dispatch" ]]
          [[ "$(jq -r '.conclusion' <<<"${run_json}")" == "success" ]]
          [[ "$(jq -r '.head_branch' <<<"${run_json}")" == "main" ]]
          [[ "$(jq -r '.path' <<<"${workflow_json}")" == ".github/workflows/release.yaml" ]]
          [[ "$(jq -r '.head_sha' <<<"${run_json}")" == "$(jq -r '.sourceSha' candidate/candidate.json)" ]]
          [[ "$(jq -r '.run_attempt' <<<"${run_json}")" == "$(jq -r '.runAttempt' candidate/candidate.json)" ]]

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install pinned yq
        run: |
          yq_path="$(bash scripts/release/install-yq.sh)"
          dirname "${yq_path}" >>"${GITHUB_PATH}"

      - name: Configure locked dependency repositories
        run: |
          helm repo add nvidia-dcgm https://nvidia.github.io/dcgm-exporter/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Verify release contract
        id: contract
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          [[ "${release_sha}" == "$(git rev-parse refs/remotes/origin/main)" ]]
          bash scripts/release/verify-release-contract.sh \
            candidate/candidate.json \
            "${CANDIDATE_RUN_ID}" \
            "${release_sha}"

      - name: Package the canonical chart once
        id: package
        run: |
          bash scripts/release/package-chart.sh \
            candidate/candidate.json \
            "${{ steps.contract.outputs.release_sha }}" \
            release-bundle

      - name: Upload canonical release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-${{ github.run_id }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Hold for T4 verification
        run: |
          {
            echo "### Canonical release bundle ready"
            echo
            echo "Download artifact \`release-bundle-${GITHUB_RUN_ID}\` and test that exact tgz on T4/K3s."
            echo "Approve the protected \`release\` environment only after the acceptance matrix passes."
            echo "Chart SHA256: \`${{ steps.package.outputs.chart_sha256 }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  publish-stable:
    name: Publish the verified bundle
    if: inputs.phase == 'publish'
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.tag }}
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
      pages: write
    steps:
      - name: Keep stable publishing fail-closed
        env:
          STABLE_RELEASES_ENABLED: ${{ vars.STABLE_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          [[ "${STABLE_RELEASES_ENABLED}" == "true" ]] || {
            echo "Stable publishing remains disabled. Configure and approve the release environment first." >&2
            exit 1
          }

      - name: Checkout verified source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          path: source
          persist-credentials: false

      - name: Checkout gh-pages without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
          persist-credentials: false

      - name: Download the canonical bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ github.run_id }}
          path: release-bundle

      - name: Require main to remain at the verified commit
        working-directory: source
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          [[ "$(git rev-parse HEAD)" == "${{ needs.prepare-release.outputs.release_sha }}" ]]
          [[ "$(git rev-parse refs/remotes/origin/main)" == "${{ needs.prepare-release.outputs.release_sha }}" ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install pinned yq
        working-directory: source
        run: |
          yq_path="$(bash scripts/release/install-yq.sh)"
          dirname "${yq_path}" >>"${GITHUB_PATH}"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Helm in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Verify the downloaded bundle
        run: bash source/scripts/release/verify-bundle.sh release-bundle

      - name: Preflight every stable destination before the first write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash source/scripts/release/preflight-publication.sh \
            release-bundle \
            "${GITHUB_REPOSITORY}" \
            pages \
            "${PAGES_URL}"

      - name: Stage the private GitHub draft and canonical assets
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash source/scripts/release/prepare-github-release.sh \
            release-bundle \
            "${GITHUB_REPOSITORY}" \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Reserve the release tag at the verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash source/scripts/release/reserve-release-tag.sh \
            "${GITHUB_REPOSITORY}" \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Promote candidate manifests without rebuilding
        env:
          VERSION_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          jq -r '
            .images | to_entries[] as $component |
            $component.value | to_entries[] |
            [.value.repository, .value.digest, (.value.repository + ":" + env.VERSION_TAG)] |
            @tsv
          ' release-bundle/release-manifest.json |
          while IFS=$'\t' read -r source_repository source_digest target_reference; do
            bash source/scripts/release/promote-image.sh \
              "${source_repository}" "${source_digest}" "${target_reference}"
          done

      - name: Publish and pull back the same OCI chart
        run: |
          bash source/scripts/release/publish-oci.sh \
            "release-bundle/${{ needs.prepare-release.outputs.chart_file }}" \
            "${{ needs.prepare-release.outputs.version }}"

      - name: Publish classic Pages package and index together
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C pages config user.name hami-robot
          git -C pages config user.email hami-robot@users.noreply.github.com
          bash source/scripts/release/publish-pages.sh \
            "release-bundle/${{ needs.prepare-release.outputs.chart_file }}" \
            "${{ needs.prepare-release.outputs.version }}" \
            pages \
            "${PAGES_URL}"

      - name: Upload explicit Pages deployment artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages

      - name: Deploy GitHub Pages explicitly
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify public Pages package and index
        run: |
          bash source/scripts/release/verify-pages.sh \
            "release-bundle/${{ needs.prepare-release.outputs.chart_file }}" \
            "${{ needs.prepare-release.outputs.version }}" \
            "${PAGES_URL}"

      - name: Publish GitHub Release as the final mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash source/scripts/release/publish-github-release.sh \
            "${GITHUB_REPOSITORY}" \
            "${{ steps.draft.outputs.release_id }}" \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.release_sha }}" \
            release-bundle

      # Read-only verification is allowed after the final publication call.
      - name: Verify published release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash source/scripts/release/verify-published-release.sh \
            "${GITHUB_REPOSITORY}" \
            "${{ steps.draft.outputs.release_id }}" \
            "${{ needs.prepare-release.outputs.tag }}" \
            "${{ needs.prepare-release.outputs.release_sha }}" \
            release-bundle
