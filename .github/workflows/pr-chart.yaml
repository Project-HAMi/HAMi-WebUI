name: PR Chart Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ github.event_name != 'pull_request' || steps.filter.outputs.chart == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            chart:
              - 'charts/**'
              - 'scripts/verify-chart.sh'
              - '.github/workflows/pr-chart.yaml'

  verify:
    name: Helm ${{ matrix.helm-version }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.21.4
          - v4.2.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm-version }}
      - name: Verify chart
        run: bash scripts/verify-chart.sh

  pr-chart-required:
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify
    if: always()
    steps:
      - name: Aggregate chart check results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Chart change detection did not complete successfully: ${{ needs.changes.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.chart }}" != "true" ]]; then
            echo "No chart-relevant changes; skipping."
            exit 0
          fi
          if [[ "${{ needs.verify.result }}" != "success" ]]; then
            echo "Chart checks did not complete successfully: ${{ needs.verify.result }}"
            exit 1
          fi
          echo "All chart checks passed."
